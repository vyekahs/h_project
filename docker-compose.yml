x-app-common: &app-common
  build: .
  environment:
    - DATABASE_URL=postgres://user:password@db:5432/boardgameclub
    - PROTOCOL_HEADER=x-forwarded-proto
    - HOST_HEADER=x-forwarded-host
    - BODY_SIZE_LIMIT=Infinity
    # 공개 저장소에 알려진 값으로 조용히 폴백하지 않도록 기본값 없이 .env 필수화
    - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD를 .env에 설정하세요}
    - SCANNER_API_KEY=${SCANNER_API_KEY:?SCANNER_API_KEY를 .env에 설정하세요}
    - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY를 .env에 설정하세요}
    - BLE_SERVER_URL=http://ble-server:3001
    - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASS=${SMTP_PASS}
    - SMTP_TO=${SMTP_TO}
    - PUBLIC_VAPID_KEY=${PUBLIC_VAPID_KEY}
    - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
    - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
    - TZ=Asia/Seoul
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ping"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 10s
  depends_on:
    - db
  restart: always

services:
  # 블루/그린 두 슬롯 — 무중단 배포 시 scripts/deploy-blue-green.sh가 비활성 슬롯을
  # 새로 빌드/기동하고, 헬스체크 통과 후 Caddy를 그쪽으로 전환한 다음 이전 슬롯을 정지한다.
  # 둘 다 호스트 포트를 직접 열지 않고 Caddy(내부 도커 네트워크)를 통해서만 접근한다.
  app_blue:
    <<: *app-common

  app_green:
    <<: *app-common

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=boardgameclub
      - TZ=Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    restart: always
    command: postgres -c timezone=Asia/Seoul

  ble-server:
    build: ./ble-server
    environment:
      - SCANNER_API_KEY=${SCANNER_API_KEY:?SCANNER_API_KEY를 .env에 설정하세요}
      # app:3000을 직접 보지 않고 Caddy의 내부 전용 리스너(8080)를 거친다 —
      # 블루/그린 중 지금 활성인 쪽으로 항상 자동으로 연결됨 (Caddyfile의 active_app.caddy 참고)
      - SVELTEKIT_URL=http://caddy:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY를 .env에 설정하세요}
      - LISTEN_PORT=3001
      - RUST_LOG=info
      - TZ=Asia/Seoul
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./active_app.caddy:/etc/caddy/active_app.caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
  caddy_data:
  caddy_config:
