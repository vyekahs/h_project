services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/boardgameclub
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - BODY_SIZE_LIMIT=Infinity
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-hproject_scanner_secret_2026}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ble_internal_secret_2026}
      - BLE_SERVER_URL=http://ble-server:3001
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_TO=${SMTP_TO}
      - PUBLIC_VAPID_KEY=${PUBLIC_VAPID_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - TZ=Asia/Seoul
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=boardgameclub
      - TZ=Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    restart: always
    command: postgres -c timezone=Asia/Seoul

  ble-server:
    build: ./ble-server
    environment:
      - SCANNER_API_KEY=${SCANNER_API_KEY:-hproject_scanner_secret_2026}
      - SVELTEKIT_URL=http://app:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ble_internal_secret_2026}
      - LISTEN_PORT=3001
      - RUST_LOG=info
      - TZ=Asia/Seoul
    depends_on:
      - app
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    depends_on:
      - app
      - ble-server
    extra_hosts:                                                                              
      - "host.docker.internal:host-gateway"     

volumes:
  db-data:
  caddy_data:
  caddy_config:
